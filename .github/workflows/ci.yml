name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check src app tests scripts

      - name: Unit & property tests
        env:
          PYTHONHASHSEED: "0"
        run: |
          # symlink so Makefile's .venv/bin/python works in CI too
          mkdir -p .venv/bin && ln -sf "$(which python)" .venv/bin/python
          python -m pytest -q --ignore=tests/test_app_renders.py

      - name: Smoke pipeline (6 symbols, tiny models, end-to-end incl. PDF)
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "2"
        run: python -m src.cli run all --config config/config_smoke.yaml --force

      - name: Repo size guard (<95 MB tracked)
        run: |
          size_kb=$(git ls-files -z | xargs -0 du -ck | tail -1 | cut -f1)
          echo "tracked size: ${size_kb} KB"
          test "$size_kb" -lt 97280
